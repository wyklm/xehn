
name: Build XEHN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - xehn-android

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: pwsh
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;30.0.16248370"
          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK installation failed"
          }

      - name: Build Go engine
        shell: pwsh
        run: |
          $env:ANDROID_NDK_HOME = Join-Path $env:ANDROID_HOME "ndk\30.0.16248370"
          "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append
          & .\tools\build-engine.ps1 -SkipTest -SkipInit
          if ($LASTEXITCODE -ne 0) {
            throw "Go engine build failed"
          }

      - name: Build Android APK
        shell: pwsh
        run: |
          & .\tools\build-apk.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "APK build failed"
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XEHN-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

