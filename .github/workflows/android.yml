
name: Build XEHN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - xehn-android

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;30.0.16248370'

      - name: Configure Android environment
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) {
            $sdk = $env:ANDROID_SDK_ROOT
          }

          if (-not $sdk) {
            throw "Android SDK path not found"
          }

          $ndk = Join-Path $sdk "ndk\30.0.16248370"

          if (-not (Test-Path $ndk)) {
            throw "Android NDK not found: $ndk"
          }

          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append
          "ANDROID_NDK_HOME=$ndk" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Android SDK: $sdk"
          Write-Host "Android NDK: $ndk"

      - name: Build Go engine
        shell: pwsh
        run: |
          & .\tools\build-engine.ps1 -SkipTest -SkipInit

          if ($LASTEXITCODE -ne 0) {
            throw "Go engine build failed"
          }

          if (-not (Test-Path ".\app\libs\engine.aar")) {
            throw "engine.aar was not generated"
          }

      - name: Build Android APK
        shell: pwsh
        run: |
          & .\tools\build-apk.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "Android APK build failed"
          }

          $apk = Get-ChildItem ".\app\build\outputs\apk\debug" -Filter "*.apk"

          if (-not $apk) {
            throw "APK file not found"
          }

          $apk | ForEach-Object {
            Write-Host "APK generated: $($_.FullName)"
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XEHN-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
