
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - xehn-android

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
        with:
          ref: xehn-android
          fetch-depth: 1

      - name: Check source files
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-ChildItem $env:GITHUB_WORKSPACE

          $engine = Join-Path $env:GITHUB_WORKSPACE "tools\build-engine.ps1"
          $apk = Join-Path $env:GITHUB_WORKSPACE "tools\build-apk.ps1"

          if (!(Test-Path $engine)) {
            throw "Missing tools/build-engine.ps1"
          }

          if (!(Test-Path $apk)) {
            throw "Missing tools/build-apk.ps1"
          }

          Write-Host "Both build scripts found."

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;30.0.16248370'

      - name: Configure Android environment
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME

          if (!$sdk) {
            $sdk = $env:ANDROID_SDK_ROOT
          }

          if (!$sdk) {
            throw "Android SDK not found"
          }

          $ndk = Join-Path $sdk "ndk\30.0.16248370"

          if (!(Test-Path $ndk)) {
            throw "Android NDK not found: $ndk"
          }

          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append
          "ANDROID_NDK_HOME=$ndk" | Out-File $env:GITHUB_ENV -Append

          Write-Host "SDK: $sdk"
          Write-Host "NDK: $ndk"

      - name: Build Go engine
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "tools\build-engine.ps1"

          & $script -SkipTest -SkipInit

          if ($LASTEXITCODE -ne 0) {
            throw "Go engine build failed"
          }

          $aar = Join-Path $env:GITHUB_WORKSPACE "app\libs\engine.aar"

          if (!(Test-Path $aar)) {
            throw "engine.aar was not generated"
          }

          Write-Host "Engine AAR generated successfully."

      - name: Build Android APK
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "tools\build-apk.ps1"

          & $script

          if ($LASTEXITCODE -ne 0) {
            throw "Android APK build failed"
          }

          $apkDir = Join-Path $env:GITHUB_WORKSPACE "app\build\outputs\apk\debug"
          $files = Get-ChildItem $apkDir -Filter "*.apk" -ErrorAction SilentlyContinue

          if (!$files) {
            throw "APK file not found"
          }

          $files | ForEach-Object {
            Write-Host "Generated APK: $($_.FullName)"
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XEHN-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
